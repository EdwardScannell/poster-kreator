[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "poster-kreator"
version = "0.1.0"
description = "Arrange equally spaced shapes on a page, each holding a plain text blob or an image, and export it ready to print."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Edward Scannell" }]
keywords = ["poster", "layout", "signage", "word-wall", "print", "shapes", "classroom"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.6", "typer>=0.12", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
poster = "poster_kreator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/poster_kreator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "regression: a real incident turned into a permanent test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["poster_kreator"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["poster_kreator"]
branch = true
